# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx5G
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=26.3
fabric_version=0.164.0+26.3
loader_version=0.19.5

# Mod options
mod_id=sophisticatedcore
mod_name=Sophisticated Core
mod_license=GNU General Public License v3.0
mod_version=1.2.10
mod_group_id=sophisticatedcore
mod_authors=P3pp3rF1y, Salandora
mod_description=A library / shared functionality mod for Sophisticated Storage and Backpacks
mod_credits=Created by P3pp3rF1y. Ported to Fabric by Salandora.
mod_logo_file=SophisticatedCoreFabric.png
mod_display_url=https://www.curseforge.com/minecraft/mc-mods/sophisticated-core-unofficial-fabric-port
mod_issue_tracker_url=https://github.com/P3pp3rF1y/SophisticatedCore/issues
mod_sources_url=https://github.com/P3pp3rF1y/SophisticatedCore
github_package_url=https://maven.pkg.github.com/Salandora/SophisticatedCore

# If set to "none" we use the version provided by fabric loader
mixin_extras_version = 0.5.4

#publish
curseforge_id=979317
modrinth_project_id=9jxwkYQL
release_type=release
release_versions=26.3

# Dependencies
# Porting Lib has no 26.x line, so its types live in net.p3pp3rf1y.sophisticatedcore.platform.
# team.reborn.energy is no longer published; the battery upgrade keeps its own buffer instead.

# Compat
# https://modrinth.com/mod/jei/versions?g=26.3&l=fabric
jei_version = 31.17.0.107
# https://modrinth.com/mod/rei/versions?g=26.3&l=fabric
rei_version = 26.3.824+fabric
# EMI has no 26.3 Fabric build; that compat package stays out of the source set until it does.
emi_version = none

# https://github.com/Fuzss/forgeconfigapiport/tree/main
forge_config_api_port_version = 26.3.1

# https://modrinth.com/mod/jade/versions?g=26.3&l=fabric
jade_version = 26.3.5+fabric

# https://modrinth.com/mod/cloth-config/versions?g=26.3&l=fabric
cloth_config_version=26.3.159+fabric

# https://modrinth.com/mod/modmenu/versions?g=26.3&l=fabric
modmenu_version=21.0.0

# https://modrinth.com/mod/balm/versions?g=26.3&l=fabric
balm_version=26.3.0.3+fabric-26.3
# https://modrinth.com/mod/crafting-tweaks/versions?g=26.3&l=fabric
crafting_tweaks_version=26.3.0.1+fabric-26.3

# https://modrinth.com/mod/litematica/versions?g=26.3&l=fabric
litematica_version=0.29.1

# Simple Voice Chat
# https://modrinth.com/plugin/simple-voice-chat/versions?l=fabric&g=26.3
simple_voice_chat_version=fabric-2.6.27+26.3

# AudioPlayer
# https://modrinth.com/mod/audioplayer/versions?l=fabric&g=26.3
audioplayer_version=fabric-2.5.1+26.3

# Trinkets, Chipped, EMI and ModernKeyBinding have no 26.3 Fabric build yet.

# What recipe viewer to use ('emi', 'rei', or 'jei'. if you change it, don't push it)
recipe_viewer = jei
